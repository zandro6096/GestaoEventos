openapi: "3.0.3"
info:
  title: "Responsáveis de Grupo API"
  description: "Endpoints para adicionar, listar e remover responsáveis de grupos. Responsáveis são usuários com papel de gestão sobre o grupo."
  version: "1.0.0"

paths:
  /api/responsaveis-grupo:
    get:
      summary: "Listar responsáveis de um grupo"
      tags: [ResponsaveisGrupo]
      parameters:
        - name: grupo_id
          in: query
          required: true
          schema:
            type: integer
          example: 5
        - name: skip
          in: query
          schema:
            type: integer
            default: 0
        - name: take
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: "Lista de responsáveis do grupo"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ResponsavelGrupoResponse"

    post:
      summary: "Adicionar responsável ao grupo"
      tags: [ResponsaveisGrupo]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateResponsavelGrupoRequest"
      responses:
        "201":
          description: "Responsável adicionado com sucesso"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponsavelGrupoResponse"
        "409":
          description: "Usuário já é responsável deste grupo"
        "422":
          description: "Dados inválidos"

  /api/responsaveis-grupo/{id}:
    get:
      summary: "Obter responsável de grupo por ID"
      tags: [ResponsaveisGrupo]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: "Dados do responsável"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponsavelGrupoResponse"

    delete:
      summary: "Remover responsável do grupo"
      tags: [ResponsaveisGrupo]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: "ID do ResponsavelGrupo"
      responses:
        "204":
          description: "Responsável removido com sucesso"
        "404":
          description: "Responsável não encontrado"

components:
  schemas:
    CreateResponsavelGrupoRequest:
      type: object
      required: [grupo_id, usuario_id, nome]
      properties:
        grupo_id:
          type: integer
          example: 5
        usuario_id:
          type: integer
          example: 12
        nome:
          type: string
          description: "Nome descritivo/cargo do responsável neste grupo"
          example: "Líder de Célula"

    ResponsavelGrupoResponse:
      type: object
      properties:
        id:
          type: integer
        grupo_id:
          type: integer
        usuario_id:
          type: integer
        nome:
          type: string
        status:
          type: string
          enum: [ativo, inativo]
        usuario:
          $ref: "#/components/schemas/UsuarioResumo"
        criado_em:
          type: string
          format: date-time

    UsuarioResumo:
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        email:
          type: string
        foto_url:
          type: string
          nullable: true
