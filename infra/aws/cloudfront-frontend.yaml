AWSTemplateFormatVersion: "2010-09-09"
Description: GestaoEventos frontend - CloudFront + OAC + S3 + API behavior /api/*

Parameters:
  SiteBucketName:
    Type: String
    Default: seven-projects-sites

  SiteOriginPath:
    Type: String
    Default: /manager-events
    Description: Prefix path in S3 bucket used as static site root.

  FrontendDomainName:
    Type: String
    Default: sistema-eventos.seven-projetos.com

  AcmCertificateArn:
    Type: String
    Description: ACM certificate ARN in us-east-1 for frontend domain.

  ApiOriginDomainName:
    Type: String
    Description: API origin domain, e.g. abc123.execute-api.us-east-1.amazonaws.com

  ApiOriginPath:
    Type: String
    Default: ""
    Description: API stage origin path, e.g. /prod. Keep empty for $default.

  HostedZoneId:
    Type: String
    Default: ""
    Description: Route53 hosted zone ID for seven-projetos.com (optional).

  CreateDnsRecord:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"

  CreateBucketPolicy:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Set true only if this stack should own/update the bucket policy.

Conditions:
  ShouldCreateDnsRecord: !And
    - !Equals [!Ref CreateDnsRecord, "true"]
    - !Not [!Equals [!Ref HostedZoneId, ""]]

  ShouldCreateBucketPolicy: !Equals [!Ref CreateBucketPolicy, "true"]

Resources:
  FrontendOac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        Description: OAC for private S3 frontend origin
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SpaRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-spa-rewrite"
      AutoPublish: true
      FunctionConfig:
        Comment: Rewrite non-API Angular routes to index.html
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;

          if (uri.indexOf('/api/') === 0) {
            return request;
          }

          if (uri === '/' || uri.indexOf('.') === -1) {
            request.uri = '/index.html';
          }

          return request;
        }

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: GestaoEventos frontend with same-domain API routing
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Aliases:
          - !Ref FrontendDomainName
        Origins:
          - Id: static-s3
            DomainName: !Sub "${SiteBucketName}.s3.amazonaws.com"
            OriginPath: !Ref SiteOriginPath
            S3OriginConfig: {}
            OriginAccessControlId: !GetAtt FrontendOac.Id
          - Id: backend-api
            DomainName: !Ref ApiOriginDomainName
            OriginPath: !Ref ApiOriginPath
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              HTTPSPort: 443
              OriginSSLProtocols:
                - TLSv1.2
        DefaultCacheBehavior:
          TargetOriginId: static-s3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRewriteFunction.FunctionARN
          Compress: true
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: backend-api
            ViewerProtocolPolicy: https-only
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - PATCH
              - POST
              - DELETE
            CachedMethods:
              - GET
              - HEAD
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            Compress: true
        ViewerCertificate:
          AcmCertificateArn: !Ref AcmCertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: ShouldCreateBucketPolicy
    Properties:
      Bucket: !Ref SiteBucketName
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action:
              - s3:GetObject
            Resource: !Sub "arn:aws:s3:::${SiteBucketName}${SiteOriginPath}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}"

  FrontendDnsARecord:
    Type: AWS::Route53::RecordSet
    Condition: ShouldCreateDnsRecord
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref FrontendDomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt FrontendDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  FrontendDnsAAAARecord:
    Type: AWS::Route53::RecordSet
    Condition: ShouldCreateDnsRecord
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref FrontendDomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt FrontendDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

Outputs:
  DistributionId:
    Description: CloudFront distribution id
    Value: !Ref FrontendDistribution

  DistributionDomainName:
    Description: CloudFront distribution domain
    Value: !GetAtt FrontendDistribution.DomainName

  FrontendUrl:
    Description: Public frontend URL
    Value: !Sub "https://${FrontendDomainName}"
